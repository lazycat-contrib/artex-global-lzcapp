params:
  - id: admin_password
    type: secret
    name: "Admin Password"
    description: "Web console admin login password (username is fixed as ARTEX), min 8 characters"
    default_value: "$random(len=16)"
    optional: true

  - id: anthropic_api_key
    type: secret
    name: "Anthropic API Key"
    description: "Anthropic API key for the LLM agents (can also be set later in the UI LLM settings)"
    default_value: ""
    optional: true

  - id: openai_api_key
    type: secret
    name: "OpenAI API Key"
    description: "OpenAI API key (alternative LLM provider)"
    default_value: ""
    optional: true

  - id: llm_provider
    type: string
    name: "LLM Provider"
    description: "Optional: anthropic / openai / openai-compatible provider name"
    default_value: ""
    optional: true

  - id: llm_model
    type: string
    name: "LLM Model"
    description: "Optional: model name (e.g. claude-opus-4-8, gpt-4o)"
    default_value: ""
    optional: true

  - id: llm_base_url
    type: string
    name: "LLM Base URL"
    description: "Optional: OpenAI-compatible endpoint for domestic or local models"
    default_value: ""
    optional: true

locales:
